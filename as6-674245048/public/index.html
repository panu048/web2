<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Library System (Assignment 6)</h1>
        </header>

        <main>
            <section class="add-book">
                <h2>Add New Book</h2>
                <form id="addBookForm">
                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" name="isbn" required>
                    </div>
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" name="author" required>
                    </div>
                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="text" id="year" name="year" required>
                    </div>
                    <div class="form-group">
                        <label for="publisher">Publisher</label>
                        <input type="text" id="publisher" name="publisher" required>
                    </div>
                    <button type="submit">POST TO: /api/book</button>
                </form>
            </section>

            <section class="search-book">
                <h2>Search Book by ISBN</h2>
                <div class="form-group">
                    <input type="text" id="searchIsbn" placeholder="Enter ISBN e.g., 885415125421">
                    <button id="searchBtn">GET /api/book/:isbn</button>
                </div>
                <div id="searchResult"></div>
            </section>

            <section class="book-list">
                <h2>All Books</h2>
                <table id="booksTable">
                    <thead>
                        <tr>
                            <th>ISBN</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Year</th>
                            <th>Publisher</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="booksBody">
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
